services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status(); } catch (error) { if (error.codeName === 'NotYetInitialized') { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); } else { throw error; } } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/factoryflow?replicaSet=rs0}
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY dans le fichier .env}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
